server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2048

spring:
  application:
    name: ma-core-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3308/mindsetalliance_core?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Africa/Kinshasa&tinyInt1isBit=false}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        tinyInt1isBit: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        type:
          preferred_boolean_jdbc_type: TINYINT
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: Africa/Kinshasa
        hbm2ddl:
          jdbc_metadata_extraction_strategy: individually
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_SMTP_HOST:smtp.gmail.com}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_SMTP_USERNAME:}
    password: ${MAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
            protocols: TLSv1.2
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    listener:
      missing-topics-fatal: false
      auto-startup: true
    consumer:
      group-id: ma-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

springdoc:
  api-docs:
    enabled: ${ma.api-docs.enabled:false}
  swagger-ui:
    enabled: ${ma.api-docs.enabled:false}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    kafka:
      enabled: false

ma:
  flyway:
    repair-on-migrate: false
  crypto:
    aes-key: ${MA_AES_KEY:}
  auth:
    access-token-minutes: 15
    refresh-token-days: 7
    rsa-keystore: ${MA_AUTH_RSA_KEYSTORE:./data/rsa.jwk}
    demo-totp: false
    issuer: ${MA_AUTH_ISSUER:mindset-alliance-core}
    login-max-attempts: 5
    login-window-seconds: 60
  security:
    cors:
      allowed-origins: ${MA_CORS_ORIGINS:http://localhost:8080}
  kafka:
    enabled: ${MA_KAFKA_ENABLED:true}
    topics:
      courses: colisnanga.courses.events
      coursiers: colisnanga.coursiers.events
      contenus: mdr.contenus.events
      tickets: core.tickets.events
  integration:
    cnn:
      # Relais /api/cnn/** + maintien à chaud + rattrapage nocturne. Voir README « Intégration Colis na Nga ».
      enabled: ${MA_CNN_ENABLED:false}
      base-url: ${MA_CNN_BASE_URL:http://localhost:8080}
      audience: colis-na-nga
      service-token-seconds: 60
      # Secret HMAC partagé avec Colis na Nga (≥ 32 caractères). Sans lui, /api/internal/cnn/events refuse tout.
      webhook-secret: ${MA_CNN_WEBHOOK_SECRET:}
      webhook-tolerance-seconds: 300
      cache-seconds: ${MA_CNN_CACHE_SECONDS:10}
      connect-timeout-ms: 3000
      read-timeout-ms: 20000
      keep-warm: ${MA_CNN_KEEP_WARM:true}
      keep-warm-minutes: 10
      reconcile-cron: "0 15 3 * * *"
  errors:
    expose-details: false
  mail:
    from-address: ${MAIL_FROM_ADDRESS:imasinfo802@gmail.com}
    from-name: "Mindset Alliance — MA Workspace"
    frontend-base-url: ${MAIL_FRONTEND_BASE_URL:http://localhost:5173}
    welcome-on-startup: true
  # Même source que MAIL_SMTP_* : ma-core-backend/.env via spring-dotenv + LocalEnvFile.
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    timeout-seconds: 25
  tickets:
    reouverture-jours: 30
    critique-heures: 2
    elevee-heures: 8
    normale-heures: 24
    faible-heures: 72

logging:
  level:
    com.mindsetalliance.core: INFO
    org.springframework.security: WARN
    org.springframework.mail: WARN
    org.eclipse.angus.mail: WARN
    com.sun.mail: WARN